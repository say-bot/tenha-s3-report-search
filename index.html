<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>천하결전 시즌3 전보 검색</title>
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:#e6e8ee;padding:16px;}
  .card{width:min(100%,380px);padding:32px 28px 24px;border:1px solid #2a3040;border-radius:16px;
    background:#1c2029;box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center;visibility:hidden;}
  .card.show{visibility:visible;}
  .seal{width:52px;height:52px;margin:0 auto 14px;display:grid;place-items:center;font-size:23px;
    border:1px solid #4a3f22;border-radius:13px;background:#241f12;}
  h1{margin:0 0 6px;font-size:20px;color:#e8c36a;letter-spacing:.3px;}
  p{margin:0 0 20px;color:#8b93a7;font-size:13px;}
  form{display:flex;gap:8px;}
  input{flex:1;min-width:0;padding:11px 13px;border:1px solid #2a3040;border-radius:10px;background:#171a21;
    color:#e6e8ee;font-size:16px;outline:none;}
  input:focus{border-color:#e8c36a;box-shadow:0 0 0 3px rgba(232,195,106,.15);}
  button{padding:11px 16px;border:0;border-radius:10px;background:#e8c36a;color:#1a1300;
    font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;}
  button:disabled{opacity:.7;cursor:default;}
  .err{margin-top:14px;min-height:18px;font-size:12.5px;color:#f0716f;}
  .foot{margin-top:10px;font-size:11px;color:#6b7386;line-height:1.7;}
</style>
</head>
<body>
<main>
  <div class="card" id="card">
    <div class="seal">🔒</div>
    <h1>천하결전 시즌3 전보 검색</h1>
    <p>입장 암호를 입력하세요</p>
    <form id="f">
      <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="암호" autofocus>
      <button type="submit">열기</button>
    </form>
    <div class="err" id="err"></div>
    <div class="foot">한 번 열면 이 기기에서 24시간 동안 자동으로 열립니다.<br>
      다시 잠그려면 주소 끝에 <b>#lock</b> 을 붙여 여세요.</div>
  </div>
</main>

<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var KEY="tenha_s3_report_gate_v1", TTL=24*3600*1000;
  var card=document.getElementById('card'), f=document.getElementById('f'),
      pw=document.getElementById('pw'), err=document.getElementById('err'), btn=f.querySelector('button');
  var b64d=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});};
  function store(v){ try{ v===null ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} }
  function saved(){
    try{ var s=JSON.parse(localStorage.getItem(KEY)||'null');
      if(s && s.pw && s.exp>Date.now()) return s.pw; if(s) store(null); }catch(e){}
    return null;
  }
  function open_(html){ document.open(); document.write(html); document.close(); }
  function decrypt(pass){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
      .then(function(km){ return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(P.salt),iterations:P.it,hash:'SHA-256'},
          km,{name:'AES-GCM',length:256},false,['decrypt']); })
      .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(P.iv)},k,b64d(P.ct)); })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }
  function showForm(){ card.classList.add('show'); try{ pw.focus(); }catch(e){} }
  if(/^#lock$/i.test(location.hash||'')){
    store(null); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  }
  var auto=saved();
  if(auto){
    decrypt(auto).then(function(html){ store({pw:auto,exp:Date.now()+TTL}); open_(html); })
      .catch(function(){ store(null); showForm(); });
  } else showForm();
  f.addEventListener('submit',function(e){
    e.preventDefault(); err.textContent=''; btn.disabled=true; btn.textContent='여는 중…';
    var pass=pw.value;
    decrypt(pass).then(function(html){ store({pw:pass,exp:Date.now()+TTL}); open_(html); })
      .catch(function(){ err.textContent='암호가 올바르지 않습니다.'; btn.disabled=false; btn.textContent='열기'; pw.select(); });
  });
})();
</script>
